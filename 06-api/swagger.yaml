  # ═══════════════════════════════════════════════════════
  #  CASAS DE VEGETAÇÃO
  # ═══════════════════════════════════════════════════════

  /casas-vegetacao:
    get:
      tags: [Casas de Vegetação]
      summary: Listar casas de vegetação
      security:
        - bearerAuth: []
      parameters:
        - name: busca
          in: query
          schema:
            type: string
          description: Filtra por descrição ou tipo
        - name: status
          in: query
          schema:
            type: string
            enum: [ATIVA, MANUTENCAO, INATIVA]
        - name: tipo
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de casas de vegetação
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CasaVegetacao'
        '401':
          $ref: '#/components/responses/Unauthenticated'

    post:
      tags: [Casas de Vegetação]
      summary: Cadastrar casa de vegetação
      description: Requer perfil `CASA-I`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, descricao]
              properties:
                codigo:
                  type: string
                  maxLength: 20
                descricao:
                  type: string
                  maxLength: 150
                tipo:
                  type: string
                  maxLength: 60
                  default: "Casa de vegetação"
                localizacao:
                  type: string
                  maxLength: 60
                area_m2:
                  type: integer
                capacidade:
                  type: integer
                unidade_capacidade:
                  type: string
                  enum: [VASO, BANCADA]
                capacidade_total:
                  type: integer
                vasos_3cm:
                  type: integer
                vasos_5cm:
                  type: integer
                vasos_10cm:
                  type: integer
                obs:
                  type: string
                status:
                  type: string
                  enum: [ATIVA, MANUTENCAO, INATIVA]
      responses:
        '201':
          description: Casa de vegetação criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasaVegetacao'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /casas-vegetacao/tipos:
    get:
      tags: [Casas de Vegetação]
      summary: Listar tipos de espaço
      description: Retorna os tipos distintos cadastrados.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de tipos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /casas-vegetacao/{id}:
    get:
      tags: [Casas de Vegetação]
      summary: Obter casa de vegetação por ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalhes da casa de vegetação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasaVegetacao'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Casas de Vegetação]
      summary: Atualizar casa de vegetação
      description: Requer perfil `CASA-A`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                codigo:
                  type: string
                  maxLength: 20
                descricao:
                  type: string
                  maxLength: 150
                tipo:
                  type: string
                  maxLength: 60
                localizacao:
                  type: string
                area_m2:
                  type: integer
                capacidade:
                  type: integer
                unidade_capacidade:
                  type: string
                  enum: [VASO, BANCADA]
                capacidade_total:
                  type: integer
                obs:
                  type: string
                status:
                  type: string
                  enum: [ATIVA, MANUTENCAO, INATIVA]
      responses:
        '200':
          description: Casa de vegetação atualizada
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [Casas de Vegetação]
      summary: Excluir casa de vegetação
      description: Requer perfil `CASA-E`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Excluída
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /casas-vegetacao/{id}/situacao:
    patch:
      tags: [Casas de Vegetação]
      summary: Alterar situação
      description: "Requer perfil admin. Alterna entre ATIVA, MANUTENCAO e INATIVA."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ATIVA, MANUTENCAO, INATIVA]
      responses:
        '200':
          description: Situação alterada
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /casas-vegetacao/{id}/disponibilidade:
    get:
      tags: [Casas de Vegetação]
      summary: Verificar disponibilidade
      description: Retorna a capacidade disponível por período.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: data_inicio
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: data_fim
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Disponibilidade do período
        '401':
          $ref: '#/components/responses/Unauthenticated'

  # ═══════════════════════════════════════════════════════
  #  RESERVAS
  # ═══════════════════════════════════════════════════════

  /reservas:
    get:
      tags: [Reservas]
      summary: Listar reservas
      description: Admin vê todas; demais veem apenas dos seus projetos.
      security:
        - bearerAuth: []
      parameters:
        - name: casa_vegetacao_id
          in: query
          schema:
            type: integer
        - name: projeto_id
          in: query
          schema:
            type: integer
        - name: situacao
          in: query
          schema:
            type: string
            enum: [PENDENTE, APROVADA, CANCELADA]
        - name: data_inicio
          in: query
          schema:
            type: string
            format: date
        - name: data_fim
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Lista de reservas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reserva'
        '401':
          $ref: '#/components/responses/Unauthenticated'

    post:
      tags: [Reservas]
      summary: Criar reserva
      description: |
        Requer perfil `RESERVA-I` ou `reserva.criar` no projeto.
        Valida se a quantidade cabe na capacidade livre do período.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [casa_vegetacao_id, funcionario_id, quantidade, data_inicio, data_fim, finalidade]
              properties:
                casa_vegetacao_id:
                  type: integer
                funcionario_id:
                  type: integer
                  description: Pesquisador responsável
                projeto_id:
                  type: integer
                  description: Obrigatório para não-admin
                quantidade:
                  type: integer
                  minimum: 1
                data_inicio:
                  type: string
                  format: date
                data_fim:
                  type: string
                  format: date
                finalidade:
                  type: string
                  maxLength: 255
                obs:
                  type: string
      responses:
        '201':
          description: Reserva criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /reservas/{id}:
    get:
      tags: [Reservas]
      summary: Obter reserva por ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalhes da reserva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Reservas]
      summary: Atualizar reserva pendente
      description: Requer autorização via ReservaPolicy. Revalida capacidade.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                casa_vegetacao_id:
                  type: integer
                quantidade:
                  type: integer
                  minimum: 1
                data_inicio:
                  type: string
                  format: date
                data_fim:
                  type: string
                  format: date
                finalidade:
                  type: string
                  maxLength: 255
                obs:
                  type: string
      responses:
        '200':
          description: Reserva atualizada
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [Reservas]
      summary: Excluir reserva
      description: Requer autorização via ReservaPolicy.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Reserva excluída
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reservas/{id}/aprovar:
    post:
      tags: [Reservas]
      summary: Aprovar reserva
      description: Requer perfil `RESERVA-A`. Revalida capacidade no momento da aprovação.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Reserva aprovada
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Capacidade insuficiente no momento da aprovação

  /reservas/{id}/cancelar:
    post:
      tags: [Reservas]
      summary: Cancelar reserva
      description: Requer autorização via ReservaPolicy.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Reserva cancelada
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ═══════════════════════════════════════════════════════
  #  ASSISTENTE (CHAT LLM)
  # ═══════════════════════════════════════════════════════

  /assistente:
    get:
      tags: [Assistente]
      summary: Verificar disponibilidade do assistente
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Status do assistente
          content:
            application/json:
              schema:
                type: object
                properties:
                  disponivel:
                    type: boolean

    post:
      tags: [Assistente]
      summary: Enviar mensagem ao assistente
      description: |
        Envia mensagem ao LLM (Groq). A última mensagem deve ter `role: "user"`.
        **Rate limit:** configurável via `GROQ_LIMITE_POR_MINUTO`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mensagens]
              properties:
                mensagens:
                  type: array
                  maxItems: 32
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                        maxLength: 2000
      responses:
        '200':
          description: Resposta do assistente
          content:
            application/json:
              schema:
                type: object
                properties:
                  resposta:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

